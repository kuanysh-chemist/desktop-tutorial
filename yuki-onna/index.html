<script>
// interactive preview: ?t=12.5 renders a still; otherwise plays in real time
const q=new URLSearchParams(location.search);
READY.then(()=>{ if(q.has('t')) renderAt(parseFloat(q.get('t'))); else if(!q.has('render')){ const t0=performance.now(); (function loop(){ renderAt(((performance.now()-t0)/1000)%END); requestAnimationFrame(loop); })(); } window.LOADED=true; });
