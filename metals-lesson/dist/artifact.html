        <div class="key" data-a="r" style="--d:.4s"><span class="lb">${L('Неге?', 'Почему?')}</span><span class="t" style="font-size:17px">${L('Тығыздық атом массасына, радиусына және қаптама тығыздығына байланысты. <b>Al, Mg, Ti</b> — авиация металдары.', 'Плотность зависит от массы атома, его радиуса и плотности упаковки. <b>Al, Mg, Ti</b> — металлы авиации.')}</span></div>

    const chips = $('#dnChips', root); chips.innerHTML = M.map(m => `<button class="dnc noswipe" data-s="${m[0]}" style="--mc:${MET[m[0]]}"><i></i><b>${m[0]}</b></button>`).join('');
    const bars = $('#dnBars', root);
    bars.innerHTML = M.map(m => `<div class="r ctr dnr" data-s="${m[0]}" style="gap:8px;margin:2.5px 0"><b style="width:26px;font-size:15px">${m[0]}</b><div class="bar" style="flex:1;height:13px"><i style="background:${m[1] < 5 ? '#22c55e' : '#f97316'};width:${Math.sqrt(m[1] / 22.59) * 100}%;transition-delay:${M.indexOf(m) * .05}s"></i></div><span class="num sm" style="width:46px;text-align:right;font-size:14px">${String(m[1]).replace('.', ',')}</span></div>`).join('') +
      `<div class="abs" style="left:calc(34px + (100% - 34px - 54px) * .4725);top:-4px;bottom:-2px;border-left:3px dashed var(--bad);pointer-events:none"></div>
       <div class="abs sm" style="right:0;bottom:-20px;font-size:13px;color:var(--bad)">${L('5 г/см³: жеңіл | ауыр', '5 г/см³: лёгкие | тяжёлые')}</div>`;
    const blocks = [], parts = []; let t = 0, sel = null;
    const mass = $('#dnMass', root);
    const sync = () => { $('#dnClr', root).textContent = T('Тазалау', 'Очистить'); };
    $('#dnClr', root).onclick = () => { blocks.length = 0; };
    const drop = sym => {
      const m = M.find(q => q[0] === sym); sel = m;
      const n = blocks.length % 10, bx = 70 + n * 56 + rnd(-6, 6);
      blocks.push({ s: sym, rho: m[1], x: bx, y: -SZ - 4, vy: 0, rest: false, in: false });

      enter() { blocks.length = 0; sel = null; mass.textContent = '—'; $$('.dnr', root).forEach(r => r.classList.remove('sel')); sync(); $$('#dnBars .bar i', root).forEach(i => { const w = i.style.width; i.style.width = '0'; D.later(() => i.style.width = w, 300); }); },
      tick(dt) {
        t += dt; const x = cv.begin();
        /* су */
        const g = x.createLinearGradient(0, SURF, 0, BOT); g.addColorStop(0, 'rgba(96,165,250,.55)'); g.addColorStop(1, 'rgba(37,99,235,.75)');
        x.beginPath(); x.moveTo(24, SURF); for (let i = 0; i <= 64; i++) x.lineTo(24 + i * 10, SURF + Math.sin(t * 2.4 + i * .5) * 2.6); x.lineTo(W - 24, BOT); x.lineTo(24, BOT); x.closePath(); x.fillStyle = g; x.fill();

        G.txt(x, T('су (1 г/см³)', 'вода (1 г/см³)'), W - 120, SURF + 20, { size: 15, color: '#1e3a8a', weight: 900 });
        blocks.forEach(b => {
          if (b.rest) return;
          if (!b.in && b.y + SZ >= SURF) { b.in = true; for (let k = 0; k < 14; k++) parts.push({ x: b.x + SZ / 2, y: SURF, vx: rnd(-90, 90), vy: rnd(-260, -80), l: .7 }); b.vy *= .45; }
          if (!b.in) b.vy += 1500 * dt;
          else if (b.rho >= 1) b.vy += (1100 * (1 - 1 / b.rho) - 7 * b.vy) * dt;
          else { const ty = SURF - SZ * (1 - b.rho); b.vy += (-190 * (b.y - ty) - 5.2 * b.vy) * dt; }
          b.y += b.vy * dt;
          if (b.in && b.rho >= 1) { const under = blocks.filter(o => o !== b && o.rest && Math.abs(o.x - b.x) < SZ * .9).length; const fl = BOT - SZ * (under + 1); if (b.y >= fl) { b.y = fl; b.vy = 0; b.rest = true; } }

          G.txt(x, b.s, 0, -3, { size: 20, color: '#14213d', weight: 900 }); G.txt(x, String(b.rho).replace('.', ','), 0, 15, { size: 11, color: '#14213d', weight: 800 }); x.restore();
        });

      }
    };

/* ---------- Балқу температурасы ---------- */
Deck.add({
  id: 'melting', ch: 2, time: 4,
  t: ['Металдардың балқу температурасы', 'Температура плавления металлов'],
  note: ['Температураны сырғытқышпен көтеріңіз: әр металл өз балқу температурасына жеткенде ериді. Сынап бөлме температурасында сұйық, галлий қолда ериді (36 °C), вольфрам — қыздыру шамының қылы (3422 °C). Балқыту үшін металдық байланысты әлсірету керек: ол атом көп электрон беріп, радиусы кіші болғанда күшті. Na-да 1 электрон ғана, W-де байланысқа көп электрон қатысады. Шкала −60 °C-тан басталады: сынап көрінсін деп.',
    'Поднимайте температуру ползунком: каждый металл плавится, когда достигает своей температуры плавления. Ртуть жидкая при комнатной температуре, галлий плавится в руке (36 °C), вольфрам — нить ламп накаливания (3422 °C). Чтобы расплавить металл, нужно ослабить металлическую связь: она прочнее, когда атом отдаёт больше электронов и имеет меньший радиус. У Na — 1 электрон, у W — много электронов участвуют в связи. Шкала начинается от −60 °C, чтобы показать ртуть.'],
  fact: ['<p>Галлий <b>қолда ериді</b> (балқу t° = 30 °C), ал сынап бөлме температурасында сұйық. Вольфрам 3422 °C-та ғана балқиды, сондықтан ол — қыздыру шамының қылы.</p>', '<p>Галлий <b>плавится в руке</b> (30 °C), а ртуть жидкая при комнатной температуре. Вольфрам плавится лишь при 3422 °C — поэтому из него делают нити ламп накаливания.</p>'],
  bridge: ['Қыздырдық, енді — металды сызып көрейік: қайсысы қатты?', 'Нагрели — теперь поцарапаем: какой металл твёрже?'],
  html: () => `

        M.forEach((m, i) => {

          else if (o.shape === 'wire') { x.strokeStyle = '#d98324'; x.lineWidth = 4; x.lineCap = 'round'; x.beginPath(); for (let i = 0; i < 3; i++) x.arc(-12 + i * 12, 0, 6, Math.PI, 0, i % 2 === 1); x.stroke(); }

          x.restore();
          G.txt(x, o.k, o.x, o.att ? o.y + 26 : 392 + 12, { size: 14, color: o.att ? D.col.ink : '#3b2a14', weight: 900 });
          if (o.msgT > 0) { x.globalAlpha = Math.min(1, o.msgT); G.txt(x, T('тартылмайды ✕', 'не тянется ✕'), o.x, o.y - 30, { size: 14, color: '#e11d48', weight: 900 }); x.globalAlpha = 1; }
        });
        /* магнит (тұяқ тәрізді) */
        x.save(); x.translate(mag.x, mag.y); x.lineWidth = 16; x.lineCap = 'butt';
        x.strokeStyle = '#ef4444'; x.beginPath(); x.arc(0, 0, 28, Math.PI, Math.PI * 1.5); x.stroke(); x.strokeStyle = '#3b82f6'; x.beginPath(); x.arc(0, 0, 28, Math.PI * 1.5, Math.PI * 2); x.stroke();
        x.strokeStyle = '#ef4444'; x.beginPath(); x.moveTo(-28, 0); x.lineTo(-28, 38); x.stroke(); x.strokeStyle = '#3b82f6'; x.beginPath(); x.moveTo(28, 0); x.lineTo(28, 38); x.stroke();
        x.fillStyle = '#e5e7eb'; x.fillRect(-36, 38, 16, 10); x.fillRect(20, 38, 16, 10); x.restore();
        G.txt(x, 'N', mag.x - 28, mag.y + 22, { size: 13, color: '#fff' }); G.txt(x, 'S', mag.x + 28, mag.y + 22, { size: 13, color: '#fff' });
        if (near > 0 && hotOk) { x.strokeStyle = 'rgba(59,130,246,' + near * .3 + ')'; x.lineWidth = 2; for (let k = 1; k < 4; k++) { x.beginPath(); x.arc(mag.x, mag.y + 40, 40 + k * 28 + Math.sin(t * 4) * 3, Math.PI * .1, Math.PI * .9); x.stroke(); } }
        /* домендер */

          dx.save(); dx.translate(px, py); dx.rotate(d.a); dx.fillStyle = hotOk ? (field > .15 ? '#3b82f6' : '#8b9db8') : '#f59e0b'; dx.beginPath(); dx.moveTo(-14, -3); dx.lineTo(6, -3); dx.lineTo(6, -8); dx.lineTo(16, 0); dx.lineTo(6, 8); dx.lineTo(6, 3); dx.lineTo(-14, 3); dx.closePath(); dx.fill(); dx.restore();
        });

  note: ['Негізгі мақсат 9.2.1.2. Реакцияларда металл атомдары тек электрон береді және тотығады: Me⁰ − ne⁻ → Meⁿ⁺. Неге? Сыртқы деңгейде электрон аз (1–3), радиус үлкен, электртерістілік төмен: 1–3 электронды беру 5–7 электронды қабылдаудан оңай. Сондықтан металдарда теріс тотығу дәрежесі болмайды. Оқушыларға Mg және Fe үшін электрондық баланс жаздырыңыз: Fe⁰ − 2e⁻ → Fe²⁺, Fe⁰ − 3e⁻ → Fe³⁺. Белсенділік қатары: тотықсыздандыру қабілеті солдан оңға қарай кемиді.',
    'Ключевая цель 9.2.1.2. В реакциях атомы металлов только отдают электроны и окисляются: Me⁰ − ne⁻ → Meⁿ⁺. Почему? Электронов на внешнем уровне мало (1–3), радиус велик, электроотрицательность низкая: отдать 1–3 электрона легче, чем принять 5–7. Поэтому у металлов не бывает отрицательных степеней окисления. Попросите записать электронный баланс для Mg и Fe: Fe⁰ − 2e⁻ → Fe²⁺, Fe⁰ − 3e⁻ → Fe³⁺. Ряд активности: восстановительная способность уменьшается слева направо.'],
  ans: ['Электрондық баланс: Mg⁰ − 2e⁻ → Mg²⁺; Fe⁰ − 2e⁻ → Fe²⁺; Fe⁰ − 3e⁻ → Fe³⁺. Теріс тотығу дәрежесі жоқ, себебі металл электрон қабылдамайды.', 'Электронный баланс: Mg⁰ − 2e⁻ → Mg²⁺; Fe⁰ − 2e⁻ → Fe²⁺; Fe⁰ − 3e⁻ → Fe³⁺. Отрицательных степеней окисления нет: металл не принимает электроны.'],
  fact: ['<p>Натрий мен калийді <b>керосиннің астында</b> сақтайды: ауада олар бірден тотығады, ал сумен жарылыспен әрекеттеседі.</p>', '<p>Натрий и калий хранят <b>под слоем керосина</b>: на воздухе они мгновенно окисляются, а с водой реагируют бурно.</p>'],
  bridge: ['Енді көрейік: металдар нені тотықсыздандырады?', 'Теперь посмотрим: что именно восстанавливают металлы?'],

      </div>

      <div class="r" id="rdSeries" style="gap:6px;justify-content:space-between"></div>
      <div class="r" style="margin-top:8px;gap:10px"><span class="chip k">${L('H₂-ден сол жақтағы металдар қышқылдан сутекті ығыстырады', 'Металлы левее H₂ вытесняют водород из кислот')}</span><span class="chip">${L('Әр металл өзінен оң жақтағыны тұз ерітіндісінен ығыстырады', 'Каждый металл вытесняет из солей те, что правее него')}</span></div></div>`,
  init(root) {

    const eqs = [['Na⁰ − 1e⁻ → Na⁺', '+1'], ['Mg⁰ − 2e⁻ → Mg²⁺', '+2'], ['Al⁰ − 3e⁻ → Al³⁺', '+3']];
    const sync = () => { $('#rdGive', root).textContent = p > 0 ? T('↺ Қайта', '↺ Заново') : T('⚡ Электрон беру', '⚡ Отдать электроны'); $('#rdEq', root).textContent = p > .1 ? eqs[cur][0] : A[cur].s + '⁰ → ?'; };

    $('#rdGive', root).onclick = () => {
      if (p > 0) { p = 0; outs = []; sync(); return; }

      sync(); D.beep('pop');

          }
        });
        if (done) { x.strokeStyle = 'rgba(59,130,246,.5)'; x.lineWidth = 5; x.beginPath(); x.arc(cx, cy, 78, 0, 6.283); x.stroke(); }
        G.txt(x, a.s + (done ? ['⁺', '²⁺', '³⁺'][a.sh[2] - 1] : '⁰'), cx, 186, { size: 28, color: done ? D.col.ion : D.col.ink, weight: 900 });

  note: ['Пробиркалық сынақ: металл мен ерітіндіні таңдап, «Салу» батырмасын басыңыз. Реакция тек белсенділік қатарына сай жүреді: H₂-ден сол жақтағы металдар қышқылдан сутекті ығыстырады; белсенді металл өзінен оң жақтағы металды тұз ерітіндісінен ығыстырады. Темір шеге мыс купоросында қызыл мыспен қапталады. «Тексер» тапсырмасы: мырыш — CuSO₄ ерітіндісінде, мыс — ZnSO₄ ерітіндісінде. Реакция тек бірінші пробиркада жүреді: Zn + CuSO₄ → ZnSO₄ + Cu; Zn⁰ − 2e⁻ → Zn²⁺, Cu²⁺ + 2e⁻ → Cu⁰. Мыс аз белсенді, мырышты ығыстыра алмайды. Ерекше жағдайлар: азот қышқылы мен концентрлі күкірт қышқылы басқаша әрекеттеседі (сутек бөлінбейді); амфотерлі Al мен Zn сілтімен де әрекеттеседі.',
    'Пробирочный опыт: выберите металл и раствор, нажмите «Опустить». Реакция идёт только по ряду активности: металлы левее H₂ вытесняют водород из кислот; более активный металл вытесняет менее активный из раствора соли. Железный гвоздь в растворе медного купороса покрывается красной медью. Задание «Проверь себя»: цинк — в раствор CuSO₄, медь — в раствор ZnSO₄. Реакция идёт только в первой пробирке: Zn + CuSO₄ → ZnSO₄ + Cu; Zn⁰ − 2e⁻ → Zn²⁺, Cu²⁺ + 2e⁻ → Cu⁰. Медь менее активна, цинк не вытесняет. Особые случаи: азотная и концентрированная серная кислоты реагируют иначе (водород не выделяется); амфотерные Al и Zn реагируют и со щелочами.'],
  ans: ['Zn + CuSO₄ → ZnSO₄ + Cu↓ (реакция бар). Cu + ZnSO₄ → реакция жүрмейді. Баланс: Zn⁰ − 2e⁻ → Zn²⁺; Cu²⁺ + 2e⁻ → Cu⁰.', 'Zn + CuSO₄ → ZnSO₄ + Cu↓ (реакция идёт). Cu + ZnSO₄ → реакция не идёт. Баланс: Zn⁰ − 2e⁻ → Zn²⁺; Cu²⁺ + 2e⁻ → Cu⁰.'],
  fact: ['<p>Ақтоғайда мыс рудасын <b>күкірт қышқылымен шаймалап</b> (гидрометаллургия), содан кейін электролизбен мысты бөліп алады.</p>', '<p>На Актогае медную руду <b>выщелачивают серной кислотой</b> (гидрометаллургия), а затем выделяют медь электролизом.</p>'],
  bridge: ['Таза металдардың мүмкіндігі шектеулі. Қорытпа жасасақ ше?', 'У чистых металлов есть пределы. А если сделать сплав?'],
  html: () => `
    <div class="r" style="gap:16px">
      <div class="c" style="width:330px;gap:10px">
        <div class="card" data-a="l"><div class="lbl" style="margin-bottom:6px">${L('1. Металл', '1. Металл')}</div><div class="tabs sm noswipe" id="lbM"></div>
          <div class="lbl" style="margin:12px 0 6px">${L('2. Ерітінді', '2. Раствор')}</div><div class="tabs sm noswipe" id="lbS"></div>
          <div style="margin-top:14px"><button class="btn" id="lbGo" style="width:100%;justify-content:center">${L('⬇ Металды салу', '⬇ Опустить металл')}</button></div></div>
        <div class="card tint" data-a="l" style="--d:.2s"><div class="lbl" style="margin-bottom:6px">${L('Тексер өзіңді', 'Проверь себя')}</div><div class="t2" style="font-size:17px">${L('Қай пробиркада реакция жүреді?', 'В какой пробирке пойдёт реакция?')}</div>
          <div class="r" style="gap:8px;margin-top:8px"><button class="btn sm ghost" data-ch="1">Zn → CuSO₄</button><button class="btn sm ghost" data-ch="2">Cu → ZnSO₄</button></div></div>
      </div>
      <div class="panel" style="width:360px;height:462px" data-a="z"><div id="lbHost"></div></div>
      <div class="c f1" style="gap:10px">
        <div class="card" data-a="r" style="--d:.2s;min-height:178px"><div class="lbl" style="margin-bottom:6px">${L('Нәтиже', 'Результат')}</div><div id="lbRes"></div></div>
        <div class="card" data-a="r" style="--d:.35s"><div class="lbl" style="margin-bottom:6px">${L('Ерекше жағдайлар', 'Особые случаи')}</div>
          <div class="eq" style="display:block;font-size:15px;padding:5px 10px;margin:3px 0">${F('Cu + 4HNO3(конц) → Cu(NO3)2 + 2NO2↑ + 2H2O')}</div>
          <div class="eq" style="display:block;font-size:15px;padding:5px 10px;margin:3px 0">${F('2Al + 2NaOH + 6H2O → 2Na[Al(OH)4] + 3H2↑')}</div></div>
      </div>
    </div>`,
  init(root) {
    const W = 360, H = 462, cv = D.cv($('#lbHost', root), W, H);
    const MS = ['Mg', 'Zn', 'Fe', 'Cu', 'Ag'], IDX = { Mg: 0, Zn: 1, Fe: 2, Cu: 3, Ag: 4 };
    const SOL = { HCl: { name: 'HCl', cat: 'H', col: [250, 250, 225, .35] }, CuSO4: { name: 'CuSO₄', cat: 'Cu', col: [56, 167, 240, .6] }, ZnSO4: { name: 'ZnSO₄', cat: 'Zn', col: [235, 245, 250, .35] }, AgNO3: { name: 'AgNO₃', cat: 'Ag', col: [240, 245, 250, .35] } };
    const DEP = { Cu: '#b45309', Ag: '#e5e7eb', Zn: '#94a3b8' }, NEWSOL = { Fe: [190, 220, 150, .45], Cu: [120, 190, 235, .45], Mg: [240, 247, 250, .35], Zn: [240, 247, 250, .35] };
    const react = (m, sk) => { const s = SOL[sk]; if (s.cat === 'H') return IDX[m] <= 2; return IDX[m] < IDX[s.cat]; };
    const eqOf = (m, sk) => {
      const s = SOL[sk]; if (!react(m, sk)) return null;
      const OX = { Mg: ['Mg⁰ − 2e⁻ → Mg²⁺', 2], Zn: ['Zn⁰ − 2e⁻ → Zn²⁺', 2], Fe: ['Fe⁰ − 2e⁻ → Fe²⁺', 2], Cu: ['Cu⁰ − 2e⁻ → Cu²⁺', 2] };
      if (s.cat === 'H') return { eq: `${m} + 2HCl → ${m}Cl2 + H2↑`, ox: OX[m][0], rd: '2H⁺ + 2e⁻ → H₂⁰' };
      const an = sk === 'AgNO3' ? ['NO3', 1] : ['SO4', 1];
      if (s.cat === 'Ag') { const sa = m === 'Mg' ? 'Mg(NO3)2' : m + '(NO3)2'; return { eq: `${m} + 2AgNO3 → ${sa} + 2Ag↓`, ox: OX[m][0], rd: '2Ag⁺ + 2e⁻ → 2Ag⁰' }; }
      return { eq: `${m} + ${s.cat}SO4 → ${m}SO4 + ${s.cat}↓`, ox: OX[m][0], rd: `${s.cat}²⁺ + 2e⁻ → ${s.cat}⁰` };
    };
    let met = 'Zn', sol = 'CuSO4', run = false, p = 0, t = 0, strip = 0, shown = false; const parts = [];
    const tm = $('#lbM', root), ts = $('#lbS', root), res = $('#lbRes', root);
    const draw = () => {
      tm.innerHTML = MS.map(m => `<button data-m="${m}" class="${m === met ? 'on' : ''}">${m}</button>`).join('');
      ts.innerHTML = Object.keys(SOL).map(k => `<button data-s="${k}" class="${k === sol ? 'on' : ''}">${SOL[k].name}</button>`).join('');
      $$('button', tm).forEach(b => b.onclick = () => { met = b.dataset.m; clear(); draw(); });
      $$('button', ts).forEach(b => b.onclick = () => { sol = b.dataset.s; clear(); draw(); });
    };
    const clear = () => { run = false; p = 0; strip = 0; shown = false; parts.length = 0; res.innerHTML = '<p class="t2" style="margin:0">' + T('Металл мен ерітіндіні таңдап, «Салу» бас.', 'Выбери металл и раствор и нажми «Опустить».') + '</p>'; };
    const showRes = () => {
      const e = eqOf(met, sol), nm = SOL[sol].name;
      res.innerHTML = e ? `<div class="ok" style="font-size:19px;margin-bottom:6px">✓ ${T('Реакция жүреді', 'Реакция идёт')}</div><div class="eq" style="display:block;font-size:19px;padding:6px 10px">${F(e.eq)}</div><div class="t2" style="margin-top:8px;font-size:17px"><div><b class="eo">${e.ox}</b></div><div><b class="io">${e.rd}</b></div></div>`
        : `<div class="bad" style="font-size:19px;margin-bottom:6px">✕ ${T('Реакция жүрмейді', 'Реакция не идёт')}</div><div class="t2" style="font-size:17px">${met === 'Ag' || met === 'Cu' && sol === 'HCl' ? T(met + ' белсенділік қатарында сутектен кейін тұр.', met + ' стоит в ряду активности после водорода.') : T(met + ' өзінен белсенді (немесе бірдей) металды ығыстыра алмайды.', met + ' не вытесняет более активный (или тот же) металл.')}</div>`;
    };
    $('#lbGo', root).onclick = () => { clear(); run = true; D.tween(8, v => { p = v; if (v > .25 && !shown) { shown = true; showRes(); D.beep(react(met, sol) ? 'ok' : 'no'); } }, { ease: ease.lin }); D.tween(1.2, v => { strip = v; }, { ease: ease.out }); };
    $$('[data-ch]', root).forEach(b => b.onclick = () => {
      const right = b.dataset.ch === '1'; D.beep(right ? 'win' : 'no');
      if (right) { const pt = D.at(b); D.confetti(pt.x, pt.y, 50); }
      met = b.dataset.ch === '1' ? 'Zn' : 'Cu'; sol = b.dataset.ch === '1' ? 'CuSO4' : 'ZnSO4'; clear(); draw(); $('#lbGo', root).click();
    });
    draw(); clear();
    return {
      lang() { draw(); if (shown) showRes(); else clear(); },
      enter() { met = 'Zn'; sol = 'CuSO4'; draw(); clear(); },
      tick(dt) {
        t += dt; const x = cv.begin(), tx = 110, tw = 140, top = 70, bot = 410, lv = 170;
        const r = react(met, sol), pr = run && r ? clamp(p / .9, 0, 1) : 0;
        /* ерітінді */
        const c0 = SOL[sol].col, c1 = r ? (sol === 'HCl' ? c0 : sol === 'CuSO4' ? NEWSOL[met] : sol === 'AgNO3' ? NEWSOL[met] : c0) : c0;
        const cc = c0.map((v, i) => lerp(v, c1[i], pr));
        x.beginPath(); x.moveTo(tx, top); x.lineTo(tx, bot - tw / 2); x.arc(tx + tw / 2, bot - tw / 2, tw / 2, Math.PI, 0, true); x.lineTo(tx + tw, top); x.closePath();
        x.save(); x.clip(); x.fillStyle = 'rgba(' + Math.round(cc[0]) + ',' + Math.round(cc[1]) + ',' + Math.round(cc[2]) + ',' + cc[3] + ')'; x.fillRect(tx, lv, tw, 300);
        x.fillStyle = 'rgba(255,255,255,.35)'; x.fillRect(tx + 8, lv + 6, 10, 200);
        /* металл жолақ */
        const sx = tx + tw / 2 - 14, drop = 28 + ease.out(strip) * 190 - 190 + (run ? 0 : -160) + 0;
        const stripTop = run ? lerp(-60, 118, ease.out(strip)) : -60;
        if (run || shown) {
          const sy0 = stripTop, sh = 230; G.rr(x, sx, sy0, 28, sh, 4); const g = x.createLinearGradient(sx, 0, sx + 28, 0); g.addColorStop(0, G.shade(MET[met], .3)); g.addColorStop(1, G.shade(MET[met], -.2)); x.fillStyle = g; x.fill();
          if (r && sol !== 'HCl') { const dep = DEP[SOL[sol].cat]; const n = Math.floor(pr * 90); for (let i = 0; i < n; i++) { const yy = sy0 + 60 + (i * 53 % (sh - 70)), xx = sx - 4 + (i * 17 % 36); if (yy < lv) continue; x.fillStyle = dep; x.beginPath(); x.arc(xx, yy, 2 + (i % 3), 0, 6.283); x.fill(); } }
          if (r && sol === 'HCl' && run && p < .85) { const rate = met === 'Mg' ? 7 : met === 'Zn' ? 3 : 1.5; if (Math.random() < rate * dt * 4) parts.push({ x: sx + rnd(-6, 34), y: sy0 + rnd(100, 220), vx: rnd(-8, 8), vy: -rnd(40, 70), l: 3, c: 'rgba(255,255,255,.9)', hz: 1 }); }
        }
        x.restore();
        for (let i = parts.length - 1; i >= 0; i--) { const q = parts[i]; q.l -= dt; q.x += q.vx * dt + Math.sin(t * 8 + i) * .4; q.y += q.vy * dt; if (q.l <= 0 || q.y < lv - 20) { parts.splice(i, 1); continue; } x.fillStyle = q.c; x.strokeStyle = 'rgba(100,150,200,.7)'; x.lineWidth = 1.5; x.beginPath(); x.arc(q.x, q.y, 3.4, 0, 6.283); x.fill(); x.stroke(); }
        if (run && r && sol === 'HCl') G.txt(x, 'H₂↑', tx + tw / 2, lv - 36, { size: 20, color: '#2563eb', weight: 900 });
        x.strokeStyle = D.col.ink2; x.lineWidth = 5; x.lineJoin = 'round'; x.lineCap = 'round'; x.beginPath(); x.moveTo(tx - 6, top); x.lineTo(tx, top); x.lineTo(tx, bot - tw / 2); x.arc(tx + tw / 2, bot - tw / 2, tw / 2, Math.PI, 0, true); x.lineTo(tx + tw, top); x.lineTo(tx + tw + 6, top); x.stroke();
        G.txt(x, SOL[sol].name, tx + tw / 2, 448, { size: 20, color: D.col.ink, weight: 900 }); G.txt(x, met, tx + tw / 2, 30, { size: 26, color: D.col.ink, weight: 900 });
        if (!run) { G.txt(x, '⬇', tx + tw / 2, 56, { size: 22, color: D.col.ink2 }); }
        if (r && run && sol === 'CuSO4' && pr > .5) G.txt(x, T('Cu бөлінді', 'выделилась Cu'), 300, 260, { size: 14, color: '#b45309', weight: 900 });
        if (r && run && sol === 'AgNO3' && pr > .5) G.txt(x, T('Ag бөлінді', 'выделилось Ag'), 300, 260, { size: 14, color: '#64748b', weight: 900 });
      }
    };
  }
});

  note: ['Демонстрация № 5: «Металдар мен қорытпалар». Мыс, жез, қола; алюминий және дюралюминий; темір, болат және шойын үлгілерін салыстырыңыз: түсі, жылтыры, қаттылығы (үлгілерді бір-бірімен сызу), бірдей өлшемді үлгілердің массасы. Қорытпа — қоспа, жаңа химиялық зат емес: құрамын өзгертіп, қажетті қасиет таңдауға болады. Қорытпалар ежелден белгілі: қола дәуірі (б.з.д. шамамен 3000 ж.). Бүгін қорытпаның мыңдаған маркасы қолданылады.',
    'Демонстрация № 5: «Металлы и сплавы». Сравните образцы меди, латуни, бронзы; алюминия и дюралюминия; железа, стали и чугуна: цвет, блеск, твёрдость (царапаем образцы друг другом), масса одинаковых по размеру образцов. Сплав — смесь, а не новое химическое вещество: состав можно менять, подбирая нужные свойства. Сплавы известны с древности: бронзовый век (около 3000 лет до н. э.). Сегодня используется много тысяч марок сплавов.'],
  fact: ['<p>Қола дәуірі шамамен <b>б.з.д. 3000 жылдан</b> басталды: адамдар мысқа қалайы қосып, құралдар мен қарудың берігін жасады. Қазір қорытпаның <b>мыңдаған маркасы</b> бар.</p>', '<p>Бронзовый век начался примерно <b>3000 лет до н. э.</b>: люди добавляли к меди олово и получали прочные орудия и оружие. Сегодня известны <b>тысячи марок</b> сплавов.</p>'],
  bridge: ['Қорытпа ішінде атомдар қалай орналасады?', 'Как устроены атомы внутри сплава?'],
  html: () => `

        <div class="abs r" style="left:14px;bottom:12px;gap:10px;z-index:3"><button class="btn sm" id="alPlay"></button><span class="chip" style="font-size:14px">${L('Демонстрация № 5', 'Демонстрация № 5')}</span></div></div>
      <div class="c f1" style="gap:10px">
        <div class="card tint" data-a="r" style="--d:.1s"><div class="t" style="font-size:20px">${L('<b>Қорытпа</b> — екі не одан көп металдың (немесе металл мен көміртек сияқты бейметалдың) балқымасы қатқанда түзілетін, <b>металдық қасиеті бар зат</b>.', '<b>Сплав</b> — вещество с металлическими свойствами, полученное при затвердевании расплава двух или более металлов (или металла и неметалла, например углерода).')}</div></div>
        <div class="c" id="alSteps" style="gap:8px">${[['Негізгі металды балқыту', 'Расплавить основной металл', 'flame'], ['Басқа компоненттерді қосу', 'Добавить другие компоненты', 'layers'], ['Біртекті болғанша араластыру', 'Перемешать до однородности', 'gear'], ['Суыту — кристалдану', 'Охладить — кристаллизация', 'thermo']].map((s, i) => `<div class="card alstep" data-i="${i}" data-a="r" style="--d:${.2 + i * .08}s;padding:8px 14px;cursor:pointer"><div class="r ctr" style="gap:10px"><span class="sn" style="margin:0;width:34px;height:34px;font-size:17px">${i + 1}</span><span class="t2" style="font-weight:800">${L(s[0], s[1])}</span></div></div>`).join('')}</div>
        <div class="key" data-a="r" style="--d:.6s"><span class="lb">${L('Маңызды', 'Важно')}</span><span class="t" style="font-size:18px">${L('Қорытпа — <b>қоспа</b>, жаңа химиялық зат емес: құрамын өзгертіп, қасиетті таңдаймыз.', 'Сплав — это <b>смесь</b>, а не новое вещество: меняя состав, подбираем свойства.')}</span></div>
      </div>
    </div>`,
  init(root) {
    const W = 640, H = 396, cv = D.cv($('#alHost', root), W, H);
    const DUR = [3.2, 3.2, 3.4, 4.5], NAMES = [['1. Мыс балқуда…', '1. Медь плавится…'], ['2. Қалайы қосамыз', '2. Добавляем олово'], ['3. Араластырамыз', '3. Перемешиваем'], ['4. Суытамыз: кристалдар өседі', '4. Остываем: растут кристаллы']];
    let ph = 0, pp = 0, auto = false, t = 0; const seeds = Array.from({ length: 30 }, () => ({ x: rnd(0, 1), y: rnd(0, 1), c: rnd(-.12, .12) })); const pel = [];
    const steps = $$('.alstep', root), btn = $('#alPlay', root);
    const sync = () => { steps.forEach((s, i) => { s.style.outline = i === ph ? '4px solid var(--ac)' : 'none'; }); btn.textContent = auto ? T('■ Тоқтату', '■ Стоп') : T('▶ Бастау', '▶ Запустить'); };
    const setPh = i => { ph = i; pp = 0; pel.length = 0; if (i === 1) for (let k = 0; k < 7; k++) pel.push({ x: 270 + rnd(-30, 80), y: -20 - k * 40, vy: 0, in: false }); sync(); D.beep('pop'); };

    btn.onclick = () => { auto = !auto; if (auto) setPh(0); sync(); };
    return {
      lang: sync, enter() { auto = true; setPh(0); },
      tick(dt) {
        t += dt; pp += dt / DUR[ph]; if (pp >= 1) { pp = 1; if (auto && ph < 3) setPh(ph + 1); else if (ph === 3 && auto && pp >= 1) { auto = false; sync(); } }

  t: ['Рудадан металға: төрт қадам', 'От руды к металлу: четыре шага'],
  note: ['Мақсат 9.4.2.6. Руда — металл қосылыстары (оксидтер, сульфидтер, карбонаттар) бар тау жынысы. 1) Өндіру; 2) Байыту: бос жынысты бөлу (флотация, магниттік сепарация) → концентрат; 3) Тотықсыздандыру: Mⁿ⁺ + ne⁻ → M⁰; 4) Рафинирлеу: қоспалардан тазарту, көбіне электролизбен. Өздігінен кесек (самородок) түрінде тек аз белсенді металдар кездеседі: Au, Pt, кейде Ag және Cu. Металл неғұрлым белсенді болса, оны тотықсыздандыру соғұрлым қиын: сілтілік металдар мен алюминийді тек балқымаларды электролиздеп алады. Ақпарат бойынша әдістерді қатарға байланыстырыңыз.',
    'Цель 9.4.2.6. Руда — горная порода с соединениями металла (оксиды, сульфиды, карбонаты). 1) Добыча; 2) Обогащение: отделение пустой породы (флотация, магнитная сепарация) → концентрат; 3) Восстановление: Mⁿ⁺ + ne⁻ → M⁰; 4) Рафинирование: очистка от примесей, часто электролизом. Самородками встречаются только малоактивные металлы: Au, Pt, иногда Ag и Cu. Чем активнее металл, тем труднее его восстановить: щелочные металлы и алюминий получают только электролизом расплавов. Свяжите методы с рядом активности.'],
  bridge: ['Ең үлкен металлургиялық «шеф»: домна пеші', 'Главная металлургическая «кухня»: доменная печь'],
  html: () => `
    <div class="r" style="gap:12px">${[['Өндіру', 'Добыча', 'mine'], ['Байыту', 'Обогащение', 'flot'], ['Тотықсыздану', 'Восстановление', 'red'], ['Тазарту', 'Рафинирование', 'ref']].map((s, i) => `<div class="card" data-a="pop" style="--d:${.08 + i * .1}s;width:293px;padding:10px 12px"><div class="r ctr" style="gap:8px;margin-bottom:4px"><span class="sn" style="margin:0;width:32px;height:32px;font-size:16px">${i + 1}</span><b style="font-size:20px">${L(s[0], s[1])}</b></div><div class="cvh oc" data-k="${s[2]}"></div></div>`).join('')}</div>
    <div class="r" style="gap:14px;margin-top:12px">
      <div class="card" data-a="l" style="--d:.5s;width:318px"><div class="lbl" style="margin-bottom:8px">${L('Тотықсыздандыру тәсілдері', 'Способы восстановления')}</div><div class="c" id="orM" style="gap:6px"></div></div>
      <div class="c f1" style="gap:10px"><div class="card tint" data-a="r" style="--d:.6s" id="orInfo"></div>
        <div class="card" data-a="r" style="--d:.7s"><div class="r ctr sb2" style="margin-bottom:6px"><span class="lbl">${L('Металл белсенділігі', 'Активность металла')}</span><span class="sm">${L('белсенділік артады → тотықсыздандыру қиындайды', 'активность растёт → восстановить труднее')}</span></div>

    </div>`,

    const LAD = ['Li', 'K', 'Ca', 'Na', 'Mg', 'Al', 'Zn', 'Cr', 'Fe', 'Sn', 'Pb', 'Cu', 'Hg', 'Ag', 'Pt', 'Au'];
    const METH = [

      { k: 'metal', n: ['Металлотермия', 'Металлотермия'], red: ['Al, Mg (белсенді металл)', 'Al, Mg (активный металл)'], eq: 'Cr2O3 + 2Al → 2Cr + Al2O3 ; TiCl4 + 2Mg → Ti + 2MgCl2', m: ['Cr'] },
      { k: 'hydrogen', n: ['Сутектермия', 'Водородотермия'], red: ['H₂', 'H₂'], eq: 'WO3 + 3H2 → W + 3H2O', m: [] },
      { k: 'hydro', n: ['Гидрометаллургия', 'Гидрометаллургия'], red: ['ерітінді + белсендірек металл немесе ток', 'раствор + более активный металл или ток'], eq: 'CuSO4 + Fe → FeSO4 + Cu', m: ['Cu'] },
      { k: 'electro', n: ['Электрометаллургия', 'Электрометаллургия'], red: ['электр тогы (электролиз)', 'электрический ток (электролиз)'], eq: '2Al2O3 → 4Al + 3O2 (балқыма / расплав)', m: ['Li', 'K', 'Ca', 'Na', 'Mg', 'Al'] }

      const m = METH[cur];
      info.innerHTML = `<div class="r ctr sb2"><h3 style="font-size:22px">${T(m.n[0], m.n[1])}</h3><span class="chip k">${T('Тотықсыздандырғыш', 'Восстановитель')}: ${T(m.red[0], m.red[1])}</span></div><div class="eq" style="margin-top:8px;font-size:21px;white-space:normal">${F(m.eq)}</div>`;
      lad.innerHTML = LAD.map(e => `<span class="ladc ${m.m.includes(e) ? 'on' : ''}" style="--lc:${MET[e] || '#94a3b8'}">${e}</span>`).join('');
      $('#orZ', root).innerHTML = [['Электролиз', 'Электролиз', 6, '#ef4444'], ['Пиро-/металлотермия', 'Пиро-/металлотермия', 6, '#f97316'], ['Өздігінен / оңай', 'Самородные / легко', 4, '#16a34a']].map(z => `<span class="sm" style="flex:${z[2]};text-align:center;border-top:5px solid ${z[3]};padding-top:3px;font-size:13px">${T(z[0], z[1])}</span>`).join('');

    render();
    const draw = {
      mine(x, s, dt) { s.r = s.r || Array.from({ length: 5 }, (_, i) => ({ x: i * 62, k: i % 3, a: rnd(-.3, .3) })); x.fillStyle = '#94a3b8'; x.fillRect(0, 96, 269, 14); x.fillStyle = '#64748b'; x.fillRect(0, 110, 269, 18); for (let i = 0; i < 15; i++) { x.fillStyle = '#475569'; x.beginPath(); x.arc((i * 18 + t * 40) % 280, 103, 4, 0, 6.28); x.fill(); }
        s.r.forEach(r => { r.x += dt * 44; if (r.x > 290) { r.x = -40; r.k = (r.k + 1) % 3; } x.save(); x.translate(r.x, 70); x.rotate(r.a); G.rr(x, -22, -22, 44, 36, 12); x.fillStyle = '#9aa3b2'; x.fill(); x.fillStyle = ['#d98324', '#38a7f0', '#1e293b'][r.k]; [[-8, -8], [6, 0], [-4, 6]].forEach(([a, b]) => { x.beginPath(); x.arc(a, b, 5, 0, 6.28); x.fill(); }); x.restore(); });

      flot(x, s, dt) { s.p = s.p || Array.from({ length: 22 }, () => ({ x: rnd(30, 240), y: rnd(40, 120), ore: Math.random() < .45, v: rnd(20, 40) }));
        G.rr(x, 20, 24, 229, 98, 10); x.fillStyle = 'rgba(96,165,250,.28)'; x.fill(); x.fillStyle = 'rgba(255,255,255,.85)'; x.fillRect(20, 24, 229, 14);
        s.p.forEach(p => { if (p.ore) { p.y -= p.v * dt; if (p.y < 40) { p.y = 120; p.x = rnd(30, 240); } x.strokeStyle = 'rgba(255,255,255,.9)'; x.lineWidth = 2; x.beginPath(); x.arc(p.x, p.y - 5, 6, 0, 6.28); x.stroke(); x.fillStyle = '#d98324'; x.beginPath(); x.arc(p.x, p.y, 3.5, 0, 6.28); x.fill(); } else { p.y += p.v * .6 * dt; if (p.y > 118) { p.y = 44; p.x = rnd(30, 240); } x.fillStyle = '#6b7280'; x.beginPath(); x.arc(p.x, p.y, 3.4, 0, 6.28); x.fill(); } });
        x.fillStyle = D.col.ink2; x.font = '800 13px Nunito,sans-serif'; x.textAlign = 'center'; x.fillText(T('пайдалы минерал көбікке жабысады', 'нужный минерал всплывает с пеной'), 134, 14); },
      red(x, s, dt) { s.n = s.n || 0; s.e = s.e || []; s.pop = s.pop || 0; s.sp = (s.sp || 0) + dt; if (s.sp > .55 && s.n < 2) { s.sp = 0; s.e.push({ x: 20, y: rnd(40, 90) }); } s.e.forEach(e => { e.x += 130 * dt; e.y += (64 - e.y) * dt * 3; }); const hit = s.e.filter(e => e.x > 118); if (hit.length) { s.n += hit.length; s.e = s.e.filter(e => e.x <= 118); }

/* ---------- Домна пеші мен конвертер ---------- */
Deck.add({
  id: 'blast', ch: 5, time: 5,
  t: ['Домна пеші: руда → шойын → болат', 'Доменная печь: руда → чугун → сталь'],
  note: ['Шихта: темір кені (окатыштар), кокс, флюс (әктас) — жоғарыдан салады. Тотықсыздану аймағында: C + O₂ → CO₂; CO₂ + C → 2CO; Fe₂O₃ + 3CO → 2Fe + 3CO₂. Балқу аймағында темір көміртекке қанығып, шойынға айналады. Фурмалар арқылы оттегімен байытылған ыстық ауа үрленеді. Қож (бос жыныстан түзілген силикаттар) жеңіл, үстінде жүзеді; шойын ауыр, төменде жиналады және лётка арқылы шығарылады. Шойынды оттек конвертеріне құйып, оттегімен үрлейді: артық көміртек жанады (2C + O₂ → 2CO), ал Si, Mn, P қожға өтеді. Болат алынады. Қазақстанда «кен → шойын → болат → прокат» толық циклі Теміртаудағы Qarmet комбинатында жұмыс істейді.',
    'Шихта: железная руда (окатыши), кокс, флюс (известняк) — загружают сверху. Зона восстановления: C + O₂ → CO₂; CO₂ + C → 2CO; Fe₂O₃ + 3CO → 2Fe + 3CO₂. В зоне плавления железо насыщается углеродом и превращается в чугун. Через фурмы вдувают горячий воздух, обогащённый кислородом. Шлак (силикаты из пустой породы) легче и всплывает; чугун тяжелее, собирается внизу и выпускается через лётку. Чугун переливают в кислородный конвертер и продувают кислородом: лишний углерод сгорает (2C + O₂ → 2CO), а Si, Mn, P переходят в шлак. Получается сталь. В Казахстане полный цикл «руда → чугун → сталь → прокат» работает на комбинате Qarmet в Темиртау.'],
  fact: ['<p>Домна пеші <b>10–15 жыл бойы тоқтамай</b> жұмыс істейді: күрделі жөндеуге дейін ол күндіз-түні шойын береді. Үлкен домна бір ағызғанда жүздеген тонна шойын шығара алады.</p>', '<p>Доменная печь работает <b>10–15 лет без остановки</b>: до капитального ремонта она круглосуточно выдаёт чугун. Большая домна за один выпуск даёт сотни тонн чугуна.</p>'],
  bridge: ['Қазақстанда металл қайда бар? Картаға көз салайық', 'А где в Казахстане есть металлы? Посмотрим на карту'],
  html: () => `
    <div class="r" style="gap:16px">

        <div class="card tint" data-a style="--d:.6s"><div class="lbl" style="margin-bottom:8px">${L('Рефлексия', 'Рефлексия')}</div><div class="r wrap" style="gap:8px">${[['Мен түсіндім…', 'Я понял(а)…'], ['Маған қызық болды…', 'Мне было интересно…'], ['Мен көбірек білгім келеді…', 'Я хочу узнать больше о…']].map(c => `<span class="chip k" style="font-size:17px">${L(c[0], c[1])}</span>`).join('')}</div></div></div>
      <div class="c f1" style="gap:10px"><div class="card" data-a="r" style="--d:.2s"><div class="r ctr sb2" style="margin-bottom:6px"><h3 style="font-size:21px">${L('Мақсатыма жеттім бе?', 'Достиг(ла) ли я целей?')}</h3><span class="bigN num" id="smN" style="font-size:34px;color:var(--ac)">0/6</span></div>
        <div id="smG" class="c" style="gap:6px"></div></div>
        <div class="r" style="gap:10px"><button class="btn ghost" id="smAgain" style="flex:1;justify-content:center">${L('↺ Басына', '↺ В начало')}</button></div></div>
    </div>`,
  init(root) {
    const G6 = [['9.1.4.1', 'Қасиетті құрылыммен түсіндіре аламын', 'Объясняю свойства через строение'], ['9.2.1.2', 'Физикалық және химиялық қасиеттерді сипаттай аламын', 'Описываю физические и химические свойства'], ['9.1.4.3', 'Қорытпаның артықшылығын түсіндіре аламын', 'Объясняю преимущества сплава'], ['9.1.4.4', 'Шойын мен болатты салыстыра аламын', 'Сравниваю чугун и сталь'], ['9.4.2.5', 'Қазақстан кен орындарын атай аламын', 'Называю месторождения Казахстана'], ['9.4.2.6', 'Рудадан металл алу жолын сипаттай аламын', 'Описываю получение металла из руды']];
    const on = new Set(); const box = $('#smG', root), n = $('#smN', root);
    const render = () => { box.innerHTML = G6.map((g, i) => `<button class="gck ${on.has(i) ? 'on' : ''}" data-i="${i}"><span class="bx">${on.has(i) ? '✓' : ''}</span><span class="chip k" style="font-size:13px;padding:2px 8px">${g[0]}</span><span>${T(g[1], g[2])}</span></button>`).join(''); n.textContent = on.size + '/6';
      $$('.gck', box).forEach(b => b.onclick = () => { const i = +b.dataset.i; on.has(i) ? on.delete(i) : on.add(i); render(); D.beep(on.has(i) ? 'ok' : 'pop'); if (on.size === 6) { const pt = D.at(n); D.confetti(pt.x, pt.y, 140); D.beep('win'); } }); };
    $('#smAgain', root).onclick = () => D.go(0);
    render();
    return { lang: render, enter() { on.clear(); render(); D.later(() => D.confetti(640, 120, 90), 700); } };
  }
});
