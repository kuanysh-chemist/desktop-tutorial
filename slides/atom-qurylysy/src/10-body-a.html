    <p data-i="Протондар мен нейтрондар &lt;b&gt;ядрода&lt;/b&gt; бірге тұрады. Электрондар ядроға кірмейді — олар ядроның &lt;b&gt;айналасында&lt;/b&gt; үнемі қозғалып жүреді.|Протоны и нейтроны вместе находятся &lt;b&gt;в ядре&lt;/b&gt;. Электроны в ядро не попадают — они всё время движутся &lt;b&gt;вокруг&lt;/b&gt; него.|Protons and neutrons stay together &lt;b&gt;in the nucleus&lt;/b&gt;. Electrons never go inside — they keep moving &lt;b&gt;around&lt;/b&gt; it."></p>
